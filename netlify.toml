# netlify.toml
[build]
  command = "npm --prefix calendar-app-mobile/calendar-app-mobile install && npm --prefix calendar-app-mobile/calendar-app-mobile run build"
  publish = "calendar-app-mobile/calendar-app-mobile/dist"

[build.environment]
  NODE_VERSION = "18"

# Serve static files directly (don't redirect to index.html)
[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200

[[redirects]]
  from = "/screenshots/*"
  to = "/screenshots/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# SPA fallback - only for routes that don't match files
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200