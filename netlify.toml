[build]
  base = "calendar-app-mobile/calendar-app-mobile/calendar-app-mobile"
  command = "npm --prefix calendar-app-mobile/calendar-app-mobile/calendar-app-mobile install && npm --prefix calendar-app-mobile/calendar-app-mobile/calendar-app-mobile run build"
  publish = "calendar-app-mobile/calendar-app-mobile/calendar-app-mobile/dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
